[workspace]
authors = ["Thomas A Caswell <tcaswell@bnl.gov>"]
channels = ["conda-forge"]
name = "Lab6_testdata_share"
platforms = ["linux-64", "win-64", "osx-arm64"]
version = "0.1.0"

[environments]
prek = { features = ["prek"], solve-group = "prek", no-default-feature = true }
test = { features = ["test"], solve-group = "default" }
default = { solve-group = "default" }

[dependencies]
matplotlib = ">=3.10.1,<4"
ipython = ">=9.2.0,<10"
numpy = ">=2.2.5,<3"
h5py = ">=3.13.0,<4"
hdf5-external-filter-plugins-lz4 = ">=0.1.0,<0.2"
hdf5-external-filter-plugins-bitshuffle = ">=0.1.0,<0.2"
scikit-image = ">=0.25.2,<0.26"
tqdm = ">=4.67.1,<5"
python = ">=3.13"
pyyaml = ">=6.0.2,<7"
pytest = ">=8.3.5,<9"
hdf5plugin = ">=6.0.0,<7"
sparse = ">=0.17.0,<0.18"
pyarrow = ">=22.0.0,<23"
git = ">=2.52.0,<3"

[feature.prek.dependencies]
prek = ">=0.3.0"

[feature.prek.tasks]
prek = "prek run --all-files"

[feature.test.dependencies]
pytest = "*"
pytest-cov = "*"

[feature.test.tasks]
test = "pytest"

[pypi-dependencies]
multihead = { path = ".", editable = true }
